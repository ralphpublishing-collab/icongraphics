<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>ICON GRAPHICS form registration</title>
  </head>
  <body>
    <!-- ICON_FORMS_REGISTRATION -->
    <form
      name="project-enquiry"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project-enquiry" /><input
        name="name"
      /><input type="email" name="email" /><input
        type="tel"
        name="phone"
      /><input name="business" /><input name="service" /><input
        name="budget"
      /><textarea name="message"></textarea
      ><input name="contact-method" /><input
        type="checkbox"
        name="consent"
      /><input name="bot-field" />
      <input name="additional-services" />
      <input name="currency" /><input type="date" name="deadline" />
      <textarea name="deliverables"></textarea
      ><textarea name="reference-links"></textarea>
      <input type="file" name="reference-file" />
      <textarea name="brief-goals"></textarea
      ><textarea name="brief-direction"></textarea
      ><textarea name="brief-requirements"></textarea>
    </form>
  </body>
</html>
